<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- PNG rather than SVG: the mark is the owner's raster artwork, and tracing it into
         vectors would be redrawing it. Three sizes so the browser picks rather than
         downsamples - at 16px the rings are already at the edge of legibility. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) meaningful, which the
         bottom action bars on narrow screens rely on. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- The plate in dark, the paper in light: the browser chrome then continues the
         surface the app is already painting rather than cutting across it. -->
    <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151617" media="(prefers-color-scheme: dark)" />

    <meta
      name="description"
      content="A workroom for the worlds you keep — their people, places, history and the rules that hold them together."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lorex" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Lorex</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
