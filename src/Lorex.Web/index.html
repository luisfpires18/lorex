<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- PNG rather than SVG: the mark is the owner's raster artwork, and tracing it into
         vectors would be redrawing it. Three sizes so the browser picks rather than
         downsamples - at 16px the rings are already at the edge of legibility. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) meaningful, which the
         bottom action bars on narrow screens rely on. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- The browser chrome continues the surface the app is painting: the paper in Light, the
         plate in Dark. The bootstrap below sets it for the theme in use. -->
    <meta name="theme-color" content="#f6f2ea" />

    <!-- The theme, before anything is drawn (013). One Lorex theme for the portal and the
         workspace: the choice saved in this browser, else the system's. Inline and first so
         no page paints in one theme and then flips; lib/theme.ts owns it afterwards and uses
         the same key and colours. Outside the lorex:head block, so the server's per-page head
         never touches it. -->
    <script>
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('lorex-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        var root = document.documentElement
        root.setAttribute('data-theme', theme)
        root.style.colorScheme = theme
        var chrome = document.querySelector('meta[name="theme-color"]')
        if (chrome) chrome.setAttribute('content', theme === 'dark' ? '#151617' : '#f6f2ea')
      })()
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lorex" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- The server replaces everything between these two markers with each page's own head -
         title, description, robots, canonical, Open Graph (ADR 0038). What stays here is the head
         for anything served without that step: the dev server, and /index.html itself. -->
    <!-- lorex:head -->
    <title>Lorex</title>
    <meta
      name="description"
      content="A workroom for the worlds you keep — their people, places, history and the rules that hold them together."
    />
    <meta name="robots" content="noindex,nofollow" />
    <!-- /lorex:head -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
